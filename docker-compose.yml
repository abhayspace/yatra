services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8100:8100"
    volumes:
      - ./backend/data:/srv/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
